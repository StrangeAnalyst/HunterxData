# Trigger-based retraining (PSI / backtest breach) with a quarterly floor.
# Champion-challenger: registers a new model version in Staging; promotion to
# Production is a deliberate, recorded action (see docs/RUNBOOK.md section B).
resources:
  jobs:
    markov_retraining:
      name: "[Markov] Retraining (champion-challenger)"
      # Quarterly floor; trigger-based runs are launched by the monitoring job
      # via the Jobs API when a breach fires.
      schedule:
        quartz_cron_expression: "0 0 4 1 1/3 ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - ${var.notification_email}
        on_success:
          - ${var.notification_email}
      job_clusters:
        - job_cluster_key: markov_train
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "Standard_DS4_v2"
            num_workers: 4
            data_security_mode: SINGLE_USER
      tasks:
        - task_key: train_kernel
          job_cluster_key: markov_train
          python_wheel_task:
            package_name: markov_pipeline
            entry_point: train_job
            parameters: ["--register", "--stage", "Staging"]
          libraries:
            - whl: ../dist/*.whl
      parameters:
        - name: training_window_end
          default: "{{job.start_time.iso_date}}"
